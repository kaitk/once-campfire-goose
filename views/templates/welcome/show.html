{% extends "layouts/application.html" %}
{%- block head %}{% endblock %}

{% block sidebar %}{{ h::sidebar_turbo_frame_tag(Some(h::routes::user_sidebar().as_str()), "") }}{% endblock %}

{% block content %}<div id="message-area" class="message-area">
  <div class="message-area--empty min-width center">
    <figure class="center pad">
      {{ h::image_tag(ctx, "messages-empty.svg", h::attrs().aria_hidden().class("colorize--black translucent")) }}
      <span class="for-screen-reader">{{ current_user_name }}</span>
    </figure>
  </div>
</div>
{% endblock %}
